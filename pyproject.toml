[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchos-tect-hf"
version = "0.1.0"
description = "Reproducible HF channel scenario and sounding research records"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
researchos-hf = "researchos_hf.cli:main"

[tool.setuptools.packages.find]
include = ["researchos_hf*"]
